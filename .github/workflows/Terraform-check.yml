name: Terraform check

on:
  pull_request:
permissions:
  contents: read  
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Initialize (no backend)
        run: terraform init -backend=false
        working-directory: infra

      - name: Validate
        run: terraform validate
        working-directory: infra

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          output_format: cli,json
          output_file_path: console,results.json          # Accepted findings, with reasons:
          # No domain, so no HTTPS: CKV_AWS_2, CKV_AWS_103, CKV_AWS_378, CKV2_AWS_20
          # Public web front door by design: CKV_AWS_260
          # Extra cost or architecture: CKV2_AWS_28, CKV_AWS_91, CKV2_AWS_11, CKV_AWS_65, CKV_AWS_338, CKV_AWS_158, CKV_AWS_136
          # Would break our workflow: CKV_AWS_150 (destroy each session), CKV_AWS_51 (the pipeline re-pushes latest)
          # Risky change, needs testing: CKV_AWS_26, CKV_AWS_336
          skip_check: CKV_AWS_2,CKV_AWS_103,CKV_AWS_378,CKV2_AWS_20,CKV_AWS_260,CKV2_AWS_28,CKV_AWS_91,CKV2_AWS_11,CKV_AWS_65,CKV_AWS_338,CKV_AWS_158,CKV_AWS_136,CKV_AWS_150,CKV_AWS_51,CKV_AWS_26,CKV_AWS_336


  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image (local only, no push)
        run: docker build -t cloudops-app:pr app

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1   # v0.35.0
        with:
          image-ref: cloudops-app:pr
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json