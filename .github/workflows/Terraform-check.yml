name: Terraform check

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/Terraform-check.yml"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Initialize (no backend)
        run: terraform init -backend=false
        working-directory: infra

      - name: Validate
        run: terraform validate
        working-directory: infra

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: false
          output_format: cli
          # Accepted findings, with reasons:
          # No domain, so no HTTPS: CKV_AWS_2, CKV_AWS_103, CKV_AWS_378, CKV2_AWS_20
          # Public web front door by design: CKV_AWS_260
          # Extra cost or architecture: CKV2_AWS_28, CKV_AWS_91, CKV2_AWS_11, CKV_AWS_65, CKV_AWS_338, CKV_AWS_158, CKV_AWS_136
          # Would break our workflow: CKV_AWS_150 (destroy each session), CKV_AWS_51 (the pipeline re-pushes latest)
          # Risky change, needs testing: CKV_AWS_26, CKV_AWS_336
          skip_check: CKV_AWS_2,CKV_AWS_103,CKV_AWS_378,CKV2_AWS_20,CKV_AWS_260,CKV2_AWS_28,CKV_AWS_91,CKV2_AWS_11,CKV_AWS_65,CKV_AWS_338,CKV_AWS_158,CKV_AWS_136,CKV_AWS_150,CKV_AWS_51,CKV_AWS_26,CKV_AWS_336
      

