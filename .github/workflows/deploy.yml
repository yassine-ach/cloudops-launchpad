name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      
      
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: prove who I am 
        run:  aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses:  aws-actions/amazon-ecr-login@v2
      
      - name: Build and push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: cloudops-launchpad-ecr
        run: |
          docker build -t $REGISTRY/$REPOSITORY:latest -t $REGISTRY/$REPOSITORY:${{ github.sha }} app
          docker push --all-tags $REGISTRY/$REPOSITORY
      
      - name: Roll out the new version
        run: aws ecs update-service --cluster cloudops-launchpad-ecs-cluster --service cloudops-launchpad-service --force-new-deployment

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster cloudops-launchpad-ecs-cluster --services cloudops-launchpad-service
      - name: install requests
        run: pip install requests 

      - name: smoke test
        run: |
          ALB=$(aws elbv2 describe-load-balancers --names cloudops-launchpad-alb --query 'LoadBalancers[0].DNSName' --output text)
          python scripts/smoke_test.py --url http://$ALB/health